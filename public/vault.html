<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messiah | Second Brain Vault</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>

  <main class="main-content" style="padding: 1.5rem; max-width: 1400px; margin: 0 auto; width: 100%;">
    
    <!-- Top Operations Header -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
      <div>
        <h1 style="font-size: 1.35rem; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 0.5rem;">
          <span>🧠</span> SECOND BRAIN VAULT
        </h1>
        <p style="color: var(--text-muted); font-size: 0.82rem;">SQLite FTS5 full-text search, persistent memories, and cron timeline.</p>
      </div>

      <!-- View Selector -->
      <div style="display: flex; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 2px;">
        <button id="tab-btn-notes" class="btn" style="background: var(--bg-elevated); color: var(--accent-green); border: none; padding: 0.35rem 0.85rem; font-size: 0.78rem; font-weight: 600; cursor: pointer; border-radius: var(--radius-sm);">
          Notes Archive (<span id="tab-notes-count" class="tabular-nums">0</span>)
        </button>
        <button id="tab-btn-reminders" class="btn" style="background: transparent; color: var(--text-muted); border: none; padding: 0.35rem 0.85rem; font-size: 0.78rem; font-weight: 600; cursor: pointer; border-radius: var(--radius-sm);">
          Timeline Reminders (<span id="tab-reminders-count" class="tabular-nums">0</span>)
        </button>
      </div>
    </div>

    <!-- Pinned Quick-Add Persistent Composer -->
    <div style="background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 0.6rem 0.85rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.75rem;">
      <span style="color: var(--accent-green); font-weight: 700; font-size: 0.9rem;">+</span>
      <input 
        type="text" 
        id="quick-add-input" 
        placeholder="Quick capture note or URL... Type #tag then content, press Enter to save" 
        style="flex: 1; background: transparent; border: none; outline: none; color: var(--text-main); font-size: 0.85rem; font-family: var(--font-sans);"
      />
      <span class="kbd-badge">ENTER</span>
    </div>

    <!-- Search-First Input Box -->
    <div style="display: flex; gap: 0.75rem; align-items: center; margin-bottom: 0.75rem;">
      <div style="flex: 1; position: relative; display: flex; align-items: center;">
        <span style="position: absolute; left: 0.85rem; color: var(--text-dim); font-size: 0.85rem;">🔍</span>
        <input 
          type="text" 
          id="vault-search-input" 
          class="form-input" 
          placeholder="Search notes with FTS5 token matching (e.g. VPS, docker, meeting)..." 
          autofocus 
          style="width: 100%; padding-left: 2.25rem; background: var(--bg-surface); border: 1px solid var(--border-subtle); color: var(--text-main); border-radius: var(--radius-sm); font-size: 0.85rem; height: 36px;"
        />
        <button id="btn-clear-search" style="display: none; position: absolute; right: 0.75rem; background: transparent; border: none; color: var(--text-dim); cursor: pointer;">✕</button>
      </div>
    </div>

    <!-- Tag Filter Chips Bar -->
    <div class="tag-chips-bar" id="tag-chips-container">
      <span style="font-size: 0.72rem; color: var(--text-dim); font-family: var(--font-mono); margin-right: 0.25rem;">TAGS:</span>
      <div class="tag-chip active" data-tag="ALL">All Notes</div>
      <!-- Dynamically populated chips: #project (14), #link (63) -->
    </div>

    <!-- Two-Pane Layout: List Left, Inspector Right -->
    <div class="two-pane-container">
      
      <!-- Left Pane: Notes / Reminders List -->
      <div class="pane-surface">
        <div class="pane-header">
          <span class="pane-title" id="list-pane-title">Vault Items</span>
          <span style="font-size: 0.72rem; color: var(--text-dim); font-family: var(--font-mono);">[j/k] Navigate · [Enter] Inspect</span>
        </div>
        <div class="pane-scrollable" id="vault-list-container">
          <div style="color: var(--text-dim); font-size: 0.85rem; padding: 2rem; text-align: center;">Loading archive...</div>
        </div>
      </div>

      <!-- Right Pane: Item Inspector / Detail Panel -->
      <div class="pane-surface">
        <div class="pane-header">
          <span class="pane-title">Memory Inspector</span>
          <div style="display: flex; gap: 0.5rem;" id="inspector-actions">
            <!-- Dynamic actions: Copy, Delete, Complete -->
          </div>
        </div>
        <div class="pane-scrollable" id="inspector-detail-container" style="padding: 1.25rem;">
          <div style="color: var(--text-dim); font-size: 0.82rem; padding: 3rem 1rem; text-align: center;">
            Select a note or reminder from the list to inspect full text, tags, and metadata.
          </div>
        </div>
      </div>

    </div>

  </main>

  <script type="module" src="/js/nav.js"></script>
  <script type="module" src="/js/pages/vault.js"></script>
</body>
</html>
