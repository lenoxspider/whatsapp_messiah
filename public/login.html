<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messiah | Authenticate</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: radial-gradient(circle at 50% 20%, rgba(37, 211, 102, 0.08) 0%, rgba(10, 15, 13, 0.95) 70%);
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: rgba(18, 26, 22, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-lg);
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      text-align: center;
    }
    .login-logo {
      font-size: 3rem;
      margin-bottom: 0.75rem;
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .login-title {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--text-main);
      margin-bottom: 0.25rem;
    }
    .login-sub {
      color: var(--text-dim);
      font-size: 0.88rem;
      margin-bottom: 2rem;
    }
    .auth-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 0.75rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">🕊️</div>
      <div class="login-title">MESSIAH</div>
      <div class="login-sub">Personal WhatsApp Control Plane</div>

      <div id="auth-error-msg" class="auth-error"></div>

      <form id="login-form">
        <div class="form-group" style="text-align: left; margin-bottom: 1.5rem;">
          <label class="form-label" for="password-input">Dashboard Master Password</label>
          <input 
            type="password" 
            id="password-input" 
            class="form-input" 
            placeholder="Enter access passphrase" 
            required 
            autofocus 
          />
        </div>

        <button type="submit" id="btn-login" class="btn btn-primary" style="width: 100%; padding: 0.85rem;">
          🔓 Unlock Messiah Console
        </button>
      </form>

      <div style="margin-top: 1.75rem; font-size: 0.78rem; color: var(--text-dim);">
        Protected by hardware session isolation. All actions encrypted.
      </div>
    </div>
  </div>

  <script type="module">
    import { showToast } from '/js/main.js';

    const loginForm = document.getElementById('login-form');
    const passwordInput = document.getElementById('password-input');
    const submitBtn = document.getElementById('btn-login');
    const errorBox = document.getElementById('auth-error-msg');

    loginForm?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = passwordInput.value;
      if (!password) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying...';
      errorBox.style.display = 'none';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          localStorage.setItem('messiah_token', data.token);
          window.location.href = '/';
        } else {
          errorBox.textContent = data.error || 'Authentication failed.';
          errorBox.style.display = 'block';
          passwordInput.value = '';
          passwordInput.focus();
        }
      } catch (err) {
        errorBox.textContent = 'Server connection error. Please try again.';
        errorBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '🔓 Unlock Messiah Console';
      }
    });
  </script>
</body>
</html>
